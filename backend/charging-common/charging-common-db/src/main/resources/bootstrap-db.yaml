# 数据库连接配置模板
# 在 application.yaml 中引用

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 基本配置
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:charging_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
      
      # 连接池配置
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000
      
      # 连接检测
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      
      # PSCache 配置
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      
      # 过滤器：统计、防火墙、SLF4J
      filters: stat,wall,slf4j
      
      # 慢 SQL 配置
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      
      # Web 监控
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      
      # 监控页面配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
    
  # MyBatis-Plus 配置
  mybatis-plus:
    # Mapper XML 文件位置
    mapper-locations: classpath*:/mapper/**/*.xml
    # 实体类包路径
    type-aliases-package: com.charging.**.entity
    # 全局配置
    global-config:
      db-config:
        # 主键类型：AUTO 自增
        id-type: AUTO
        # 逻辑删除字段
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0
    # 配置原生 MyBatis
    configuration:
      # 驼峰命名转换
      map-underscore-to-camel-case: true
      # 开启缓存
      cache-enabled: true
      # 懒加载
      lazy-loading-enabled: false
      # 日志实现
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
